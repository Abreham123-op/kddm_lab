[project]
name = "kddm-lab"
version = "0.1.0"
description = "Reproducible Olist e-commerce analytics with DuckDB"
readme = "README.md"
authors = [
    { name = "Abreham123-op", email = "abraham.munie95@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "jupyterlab>=4.5.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[project.scripts]
kddm-lab = "kddm_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
